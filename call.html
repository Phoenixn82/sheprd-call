  :root { color-scheme: dark;
    --paper: #e4ecc8; --grass: #9bbb6c; --mid: #4f7a5a; --ink: #1e2c24; --focus: #e4ecc8; --thread: 38%; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); overflow: hidden;
    font: 400 16px/1.35 "VT", ui-monospace, monospace; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .label { font: 14px/1 "VT", ui-monospace, monospace; text-transform: uppercase; }
  /* Pixel window: a chunky two-step border (dark outer step, mid inner line) on paper. */
  .win { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 4px var(--mid), 0 0 0 2px var(--paper); }
  .pix { box-shadow: 0 -3px 0 0 var(--pix, var(--ink)), 0 3px 0 0 var(--pix, var(--ink)), -3px 0 0 0 var(--pix, var(--ink)), 3px 0 0 0 var(--pix, var(--ink)); }

  /* Safe area (2026-11-07: "the stuff at the top of the app if hiding behind the phones widgits and battery and time"):
     the phone app draws edge to edge, so the WebView reports the status bar, gesture bar and cutouts as env(safe-area-inset-*);
     everything sits inside them and the bands behind the bars stay ink. */
  :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  html.kbd main { padding-bottom: 0; }  /* the keyboard covers the gesture bar */
  main { position: relative; box-sizing: border-box; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: var(--sat) var(--sar) var(--sab) var(--sal); }

  #world { position: absolute; inset: 0; bottom: calc(var(--thread) + 12px); display: flex; align-items: center; justify-content: center; touch-action: none; }
  #screen { --thread: var(--threadh, 38%); }  /* --threadh: the size he dragged the thread to (the grip below) */

     sheep blink, the grass sways). Drawn by the inline script at the top of <body>, so it is up at first paint and a
     live UI update never adds it to a page already running. */
  #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;

  /* HUD: the status line, and at the top right the mic: its level meter with the mute key beside it (2026-11-07: "The
     mic should be up near the audio indicator"). With the chat closed the Shepherd's portrait leads it, top left. */

  #status { margin: 0; max-width: 74%; padding: 3px 7px; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); font-size: 13px; line-height: 1.3; }

  @keyframes ponder { 50% { transform: translateY(-3px) rotate(-4deg); } }
  #mic { display: flex; align-items: flex-start; gap: 6px; }
  #miccheck { font-size: 11px; padding: 3px 6px; background: var(--ink); color: var(--paper); border: 2px solid var(--paper); }
  #miccheck .row { display: flex; align-items: center; gap: 6px; }

  #screen.handoff { --thread: 0px; }  /* the sign-in frame needs the room; the thread is back when it closes */
  #screen.handoff > :not(#handoff):not(#warning):not(#world):not(#bubblelive):not(#hud):not(#herdbuttons):not(#herdmore) { display: none; }
  #handofftext { margin: 0 0 8px; font-size: 16px; overflow-wrap: anywhere; }
  #handoffframe { display: block; width: 100%; height: 52vh; border: 2px solid var(--ink); background: #fff; }

  #cardimage { display: block; width: 100%; background: transparent; color: var(--ink); }

  #cardaudio p { margin: 0 0 4px; font-size: 19px; }

  .actions, #links { display: flex; flex-wrap: wrap; gap: 10px; }
  .actions { margin-top: 12px; }
  .action { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 8px 14px;
    background: var(--ink); color: var(--paper); border: 0; box-shadow: 0 3px 0 var(--mid); font: inherit; text-decoration: none; }
  .action:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--mid); }
  a:focus-visible, .action:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }  /* on paper the ring is ink */
  #cardnote { margin: 8px 0 0; font-size: 14px; }
  #warning { position: absolute; left: 8px; right: 8px; top: 44px; margin: 0; padding: 10px; font-size: 15px; }
  #viewer { box-sizing: border-box; inset: var(--sat) var(--sar) var(--sab) var(--sal); width: calc(100vw - 20px - var(--sal) - var(--sar)); max-width: none;
    height: calc(100dvh - 20px - var(--sat) - var(--sab)); max-height: none; padding: 12px; }

    #grip, #screen.chatoff #grip { bottom: calc(var(--thread) + 70px - 12px); }

<script id="bootfx">
// The loading screen's art and effect (plain JS, no assets): every character starts as noise and resolves in a sweep
// from the left, like Omarchy's screensaver (terminaltexteffects' decrypt), then the scene idles. Reduced motion: the
// art stands still. The page's script drives it through window.sheprdBoot: on(text) / say(text) / off(). A tap or a
// key skips it. aria-hidden: the page's own status line already says what is happening.
(function () {
  const ART = [" .        *           .         .--.", "      +         .         *    (    )", "*         .           +         '--'", "              .            .", "            ,-.", "     _     (   |", "    (\")     `  |", "    /|\\________|", "     |         |      .-~~~-.     .-~~-.", "     |         |     (  . .  )o> ( .  . )o>", "    / \\        |      '-...-'     '-..-'", "   /   \\       |       || ||       || ||", "~~~~~~~^~~~~~~~~~~~^~~~~~~~~~~~^~~~~~~~~~~~"];
  const SKY = 4, NOISE = "!#$%&*+-/<=>?@[]^_{|}~01:;", calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.currentScript.insertAdjacentHTML("afterend", '<div id="boot" aria-hidden="true"><pre id="bootart"></pre><p id="bootsay">Waking Sheprd…</p></div>');
  const box = document.getElementById("boot"), pre = document.getElementById("bootart"), caption = document.getElementById("bootsay");
  const rows = ART.map((line, i) => { const span = document.createElement("span"); span.className = i < SKY ? "sky" : i === ART.length - 1 ? "ground" : ""; pre.append(span, "\n"); return span; });
  const pick = (s) => s[Math.floor(Math.random() * s.length)];
  let timer = 0, start = 0, settle = [];
  function draw(lines) { lines.forEach((line, i) => { if (rows[i].textContent !== line) rows[i].textContent = line; }); }
  function idle(t) {  // stars twinkle (not the moon, past column 30), eyes blink now and then, the grass tufts sway
    const blink = t % 4200 < 160;
    draw(ART.map((line, y) => [...line].map((c, x) => {
      if (y < SKY && x < 30 && ".*+".includes(c)) return ".*+"[(Math.floor(t / 700) + x * 7 + y * 3) % 3];
      if (blink && c === "." && y > SKY && /\( .*\)o>/.test(line)) return "-";
      if (y === ART.length - 1 && c === "^") return Math.floor(t / 900 + x) % 2 ? "^" : "~";
      return c;
    }).join("")));
  }
  function frame() {
    const t = performance.now() - start;
    if (t < 2000) draw(ART.map((line, y) => [...line].map((c, x) => (c === " " || t >= settle[y][x] ? c : pick(NOISE))).join("")));
    else idle(t);
  }
  function play() {
    clearInterval(timer); start = performance.now();
    settle = ART.map((line) => [...line].map((_, x) => 250 + x * 30 + Math.random() * 500));
    if (calm) { draw(ART); return; }
    frame(); timer = setInterval(frame, 70);
  }
  function off() { clearInterval(timer); timer = 0; box.classList.add("gone"); }
  box.addEventListener("pointerdown", off);
  addEventListener("keydown", () => { if (!box.classList.contains("gone")) off(); });
  window.sheprdBoot = {
    on(text) { if (text) caption.textContent = text; if (box.classList.contains("gone")) { box.classList.remove("gone"); play(); } },
    say(text) { caption.textContent = text; },
    off,
  };
  play();
})();
</script>

  }
  function done() {
    state = "over"; held = false;
    const score = Math.floor(G.score);
    if (score > best(cur.id)) store.set("sheprdBest." + cur.id, String(score));
    draw();
    hint.textContent = "Score " + score + ". Tap to play again, or pick another game.";
    picker.hidden = false;
  }
  function start() {
    if (!cur) return;
    G.score = 0; G.s = null; cur.start(G); last = 0; state = "run"; held = false;
    hint.textContent = cur.hint; picker.hidden = true;
    raf = requestAnimationFrame(step);
  }
  function tap() { if (state === "run") { held = true; try { cur.tap(G); } catch (_) {} } else if (state !== "off") start(); }
  function release() { if (held && state === "run" && cur.release) { try { cur.release(G); } catch (_) {} } held = false; }
  function ready() {  // the picked game's first frame, still; a tap starts it
    cancelAnimationFrame(raf); size(); G.score = 0; G.s = null;
    if (cur) { try { cur.start(G); } catch (_) {} }
    draw(); state = "ready"; picker.hidden = false;
    hint.textContent = cur ? "Tap to play " + cur.name + " while you wait." : "No games loaded.";
  }
  let want = null;  // a pick made before the modules finished loading
  function pick(id) {
    const list = games();
    if (!list.length) { want = id; return; }
    cur = list.find((x) => x.id === id) || list[0] || null;
    if (cur) store.set("sheprdGame", cur.id);
    pad.setAttribute("aria-label", cur ? cur.name + ": tap here or press space to " + cur.verb.toLowerCase() : "Game board");
    syncPicker();
  }
  function syncPicker() {
    syncButtons(picker, games().map((gm) => ({ key: gm.id, text: gm.name, open: () => { if (state === "run") return; pick(gm.id); ready(); } })), { cls: "pick" });
    for (const b of picker.children) b.setAttribute("aria-pressed", String(!!cur && b.getAttribute("data-key") === cur.id));
  }
  function show() {
    if (state !== "off" || !card.hidden || !handoffBox.hidden || !herdPanel.hidden || !herdList.hidden) return;
    box.classList.add("on");
    if (!cur) pick(store.get("sheprdGame") || "run"); else syncPicker();
    if (!cur && typeof SheprdGames !== "undefined" && SheprdGames.whenLoaded) SheprdGames.whenLoaded(() => { if (state !== "off" && !cur) { pick(want || store.get("sheprdGame") || "run"); ready(); } });  // the modules were still loading
    ready(); relayout();
  }
  function hide() {
    if (state !== "off") guard = Math.max(guard, performance.now() + 800);
    cancelAnimationFrame(raf); state = "off"; held = false; box.classList.remove("on");
    relayout();
  }
  document.getElementById("gamesopen").addEventListener("click", show);
  document.getElementById("gameclose").addEventListener("click", () => { hide(); document.getElementById("gamesopen").focus(); });
  pad.addEventListener("pointerdown", (e) => { e.preventDefault(); guard = performance.now() + 600; padTapped = true; tap(); });
  pad.addEventListener("pointerup", () => release()); pad.addEventListener("pointercancel", () => release());
  pad.addEventListener("click", (e) => { e.stopPropagation(); if (padTapped) { padTapped = false; return; } tap(); release(); });  // keyboard activation
  pad.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "ArrowUp" || e.key === "Enter") { e.preventDefault(); if (!e.repeat) tap(); } });
  pad.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "ArrowUp" || e.key === "Enter") release(); });
  addEventListener("click", (e) => {
    if (performance.now() < guard && e.target.closest && e.target.closest("#props button") && !e.target.closest("#gamesopen")) {
      e.preventDefault(); e.stopImmediatePropagation();
    }
  }, true);
  addEventListener("resize", () => { if (state !== "off") { size(); draw(); } });
  return { show,
    reload() { const id = cur && cur.id, visible = state !== "off"; release(); cancelAnimationFrame(raf); cur = null; pick(id || store.get("sheprdGame") || "run"); if (visible) ready(); },
    hide, jump: tap, pick, on: () => state !== "off", get current() { return cur; } };
})();

function uiNotice(message) { if (typeof SheprdLive !== "undefined") SheprdLive.notify(message); }
if (typeof SheprdLive !== "undefined") SheprdLive.start((stage) => {
  // Mount the replacement before disposing the previous canvas. The call, DOM listeners and audio stay alive.
  const replacement = mountWorld(stage.SheprdWorld);
  replacement.setHerd(herdLayout(herdNow));
  const props = PROPS.map(p => ({ ...p, rows: p.id === "photo" ? stage.SHEPRD.SPRITES.camera.rows() : stage.SHEPRD.signGrid("PLAY").rows() }));
  if (replacement.setProps) replacement.setProps(props.filter(p => p.rows));
  if (replacement.setMark) replacement.setMark(handoffParked ? "handoff" : null);
  const previous = world;
  Object.assign(window, { SHEPRD: stage.SHEPRD, SheprdWorld: stage.SheprdWorld, SheprdGames: stage.SheprdGames });
  world = replacement;
  if (previous && previous.destroy) previous.destroy();
  game.reload(); thread.refresh(); relayout();
});

function thinking(on) {
  scr.classList.toggle("busy", on);
  thinkLive.textContent = on ? "Thinking." : "";
  sprite.set({ busy: on }); thread.waiting(on);
  if (!on && pc) say("You're on. Talk any time, even while it's speaking.");
}

function hangup(msg, lost = false) {
  callAttempt++;
  dropped = lost; boot.off();
  if (lost) showWarning("Connection dropped. The desk cannot hear you. Tap me (the shepherd) to reconnect.");
  else showWarning("");
  clearTimeout(healthTimer); events = null;
  connectionIssue = channelIssue = ""; receiving = null; healthAt = 0;
  thinking(false); game.hide(); closeHandoff(); closeList(); closeSheep(); deafen(); bubble.stop(); setSpeaker(null); clipHold(false);
  if (pc) { const p = pc; pc = null; p.close(); }
  if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
  voice.srcObject = null;
  setMuted(false); mute.disabled = true; scr.classList.remove("calling");
  btn.disabled = false; btn.textContent = "Call"; hangTapAt = 0;
  sprite.set({ calling: false, listening: false }); shellState("off"); keepAwake(false); relayout();
  say(msg || "Call ended. Tap me (the shepherd in the yard) to call again.");
}

// What survives leaving the app (2026-11-07: "when I came back to the app, it wiped everything I was just doing"):
// the phone app builds a fresh WebView for every call screen, so the thread, the desk's card (open, or dismissed so a poll does
// not bring it back), the open sheep and a Text aimed at it, the half-typed line and the last herd are saved to
// localStorage on each change and put back on load. Data only: no call, stream or timer is restored. ?demo never
// reads or writes it.
function keep() {
  if (!kept || demo) return;
  try {
    localStorage.setItem(KEEP, JSON.stringify({ thread: thread.lines(), herd: herdNow, sheep: openSheep, to: typeTarget,
      card: shownId === null ? null : { id: shownId, text: shownText, open: !card.hidden }, draft: String(typed.value || ""), size: grip.size }));
  } catch (_) {}  // storage blocked or full: the page still works, it just forgets
}
if (!demo) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEEP) || "null"); } catch (_) {}
  if (saved && typeof saved === "object") {
    if (Array.isArray(saved.herd)) herd(saved.herd);
    if (typeof saved.size === "number") grip.set(saved.size, false);
    for (const l of Array.isArray(saved.thread) ? saved.thread : [])
      if (l && ["desk", "sheep", "you"].includes(l.kind) && typeof l.name === "string" && typeof l.text === "string") {
        const e = thread.add(l.kind, l.name, l.text);
        if (l.kind !== "you" && typeof l.unspoken === "string" && l.unspoken) thread.unspoken(e, l.unspoken);
      }
    const last = thread.latest;
    if (last && last.face) thread.face(last, (last.kind === "desk" ? "shepherd-" : "sheep-") + "neutral");
    const c = saved.card;
    if (c && typeof c.id === "string" && typeof c.text === "string") {
      if (c.open === true) showCard({ type: "show", id: c.id, text: c.text });
      else { shownId = c.id; shownText = c.text; }  // dismissed: the next poll must not bring it back
    }
    if (typeof saved.sheep === "string" && herdById.has(saved.sheep)) {
      showSheep(saved.sheep);
      if (saved.to === saved.sheep) { typeTarget = saved.to; typeTo(herdById.get(saved.to).name); }
    }
    if (typeof saved.draft === "string") typed.value = saved.draft.slice(0, 4000);
  }
  kept = true;
  typed.addEventListener("input", keep);
  addEventListener("pagehide", keep);
}

// The mirror button does what a tap on the Shepherd does (a hang-up needs no second press from the keyboard: it is a
// deliberate activation). The no-mic view opens the real call (the phone app catches call?auto and opens its call screen).
btn.addEventListener("click", () => (handoffParked ? openHandoff() : viewOnly ? location.assign("call?auto") : pc ? hangup() : call()));
if (viewOnly) say("Checking for cards from your desk…");
else if (plain) say("Tap me (the shepherd in the yard) and just talk.");
relayout();
if (demo) {  // ?demo: no network; a fixed herd, the sprite cycling its states and one dialogue line. ?demo=12 places 8 and a +4.
  if (!query.has("boot")) boot.off();  // ?demo&boot keeps the loading screen up, to look at it
  // ?pose=<state> pins one state; ?sheep=<id> opens that sheep's panel; ?list opens the +N list; ?card shows a card;
  // ?speaker=<id> seats that sheep as the talker (its portrait speaks).
  const pose = query.get("pose"), order = ["idle", "listening", "thinking", "talking", "surprise", "wince", "aside", "muted"];
  const count = parseInt(query.get("demo"), 10);
  const fixed = [["w1:p4", "Release", "Ready to ship; waiting for your yes.", "blocked"], ["w1:p1", "API tests", "Fixing the tests that fail now and then.", "working"],
                 ["w1:p2", "Setup guide", "Writing the setup guide.", "working"], ["w1:p5", "Login bug", "Fixed the login bug.", "done"],
                 ["w1:p3", "Parser", "Splitting the parser into parts.", "working"], ["w1:p6", "Staging", "Staging build shipped; nothing to do.", "idle"]];
  let demoHerd = fixed.map(([id, plain, line, status]) => ({ id, name: plain.toLowerCase().replace(/ /g, "-"), plain, line, status, talk: true }));
  if (count > 0 && count !== 6) demoHerd = Array.from({ length: count }, (_, i) => ({ id: "w2:p" + (i + 1), name: ["release", "api-tests", "docs", "bugfix", "refactor", "deploy", "frontend", "backend", "migrations", "lint", "perf", "infra"][i % 12],
    title: "Tab " + (i + 1), status: i === 0 ? "blocked" : i === 1 ? "done" : "working", talk: true }));
  herd(demoHerd);
  // a sample exchange, so the thread has something to read back; ?game=<id> opens the games on that one
  thread.add("you", "You", "How is the release tab doing?");
  bubble.say("Release is ready to ship. It is waiting at the gate for your yes.", { paced: false });
  bubble.say("The api tests tab is still working through the flaky ones; two left.", { paced: false });
  thread.add("you", "You", "Okay, let me know when the tests are green.");
  if (query.get("game")) { game.pick(query.get("game")); game.show(); }
  let i = 0, level = 0;
  function demoState(s) {
    sprite.set({ busy: s === "thinking", listening: s === "listening", speaking: s === "talking", aside: s === "aside", muted: s === "muted", calling: false });
    if (s === "surprise") sprite.surprise(); else if (s === "wince") sprite.wince();
    if (s === "talking") bubble.say(talker ? "Baa. Nearly there, one check left to run." : "Howdy! I'm " + NAME + ". I keep an eye on your herd while we talk.", { paced: false, speaker: talker ? talker.name : "" });
    say(s === "talking" ? "Demo: talking on the voice level." : "Demo: " + s + ".");
  }
  if (query.get("speaker")) { const s = herdById.get(query.get("speaker")); if (s) setSpeaker({ id: s.id, name: s.name }); }
  if (!reducedMotion) (function voiceDemo() { level = (level + 1) % 4; sprite.level([1, 3, 2, 1][level]); setTimeout(voiceDemo, 140); })();
  if (demoCall) { shellState("live"); if (query.has("card")) showCard({ type: "show", text: "A card from the desk lands here. Links open in a new tab.", id: "demo" }); }
  if (query.get("sheep")) showSheep(query.get("sheep"));
  if (query.has("list")) showList();
  if (pose) { demoState(pose); if (pose === "talking") bubble.done(); }
  else (function cycle() { demoState(order[i++ % order.length]); setTimeout(cycle, 2600); })();
} else {
  if (!plain) {
    // the phone app's Sheprd launcher opens ?view in a viewer without mic permission; call?auto opens its mic-owning call screen.
    if (viewOnly) location.assign("call?auto");
    else call();
  } else boot.off();  // ?plain waits for his tap: nothing to wait for
  pollCard();
}
</script>
</body>
</html>
